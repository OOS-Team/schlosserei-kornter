<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="schlosserei kornter – macht mehr aus Metall">
  <!-- Vektor-Nachzeichnung der offiziellen Wortmarke (Facebook/Google) -->
