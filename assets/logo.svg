  <g font-family="Arial Black, Impact, Arial, Helvetica, sans-serif" font-size="96" font-weight="900">
    <text x="118" y="185" fill="#1a1a1a">k</text>
    <circle cx="228" cy="148" r="34" fill="#2B6CB0"/>
    <text x="268" y="185" fill="#1a1a1a">rnter</text>
  </g>

  <rect x="318" y="198" width="210" height="30" rx="3" fill="#2B6CB0"/>
  <text
    x="423"
    y="218"
    text-anchor="middle"
